name: controller
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  typescript:
    name: TS typecheck + tests (against the Rust moatctl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build -p moatctl
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w controller
      - run: npm test -w controller
        env:
          MOATCTL: ${{ github.workspace }}/target/debug/moatctl
