name: web
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: typecheck, test, static demo build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w web
      - run: npm test -w web
      - run: npm run build:demo -w web
      - name: Screenshots + overflow, clipping and WCAG AA contrast checks (axe-core)
        run: |
          npx playwright install --with-deps chromium
          node web/scripts/screenshots.mjs web/build/screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: web-screenshots
          path: web/build/screenshots
          if-no-files-found: warn
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: web/dist
  live-e2e:
    name: live UI against the real controller API (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo build -p moatctl
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:live -w web
      - run: npx playwright install --with-deps chromium
      - name: Browser integration tests (real controller, signer, moatctl, device-signed sync)
        run: npm run e2e -w web
        env:
          MOATCTL: ${{ github.workspace }}/target/debug/moatctl
          MOAT_SCREENSHOT_DIR: ${{ github.workspace }}/web/build/live-screenshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: web-live-screenshots
          path: web/build/live-screenshots
          if-no-files-found: ignore
  pages-check:
    name: is GitHub Pages enabled?
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' > /tmp/pages 2>/dev/null; then
            echo "Pages build_type: $(cat /tmp/pages)"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Pages deploy skipped::GitHub Pages is not enabled for this repository. Enable it at Settings > Pages > Source: GitHub Actions, then re-run this workflow."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
  deploy:
    name: deploy demo to GitHub Pages
    needs: [build, pages-check]
    if: needs.pages-check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4