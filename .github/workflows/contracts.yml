name: contracts
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  fixtures:
    name: shared fixtures (JavaScript consumer + Rust reference)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: JavaScript consumer (no Rust, no dependencies)
        run: node --test contracts/test/fixtures.test.mjs
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Rust reference
        run: cargo test -p moat-core --test contracts --test claim_ledger
      - name: moatctl contract on every valid fixture
        run: |
          cargo build -q -p moatctl
          for f in contracts/fixtures/valid/*.json; do ./target/debug/moatctl contract "$f" > /dev/null; done
          for f in contracts/fixtures/invalid/*.json; do if ./target/debug/moatctl contract "$f" > /dev/null 2>&1; then echo "accepted $f"; exit 1; fi; done
