name: linux-endpoint
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  privileged:
    name: cgroup v2 + nftables enforcement (netns)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install nftables, iproute2, jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables iproute2 jq python3
      - name: Host facts
        run: |
          uname -a
          stat -fc %T /sys/fs/cgroup
          sudo nft --version
          sudo nft list tables || true
          sudo mkdir -p /sys/fs/cgroup/moat-probe
          printf 'table inet moat_probe {\n chain c {\n  type filter hook output priority 0; policy accept;\n  socket cgroupv2 level 1 "moat-probe" accept\n }\n}\n' | sudo nft -c -f - && echo "socket cgroupv2: ok" || echo "socket cgroupv2: FAILED"
          sudo rmdir /sys/fs/cgroup/moat-probe
      - name: Build
        run: |
          cargo build -p moatd -p moatctl
          cargo test -p moatd --test privileged --no-run
      - name: Privileged session-boundary tests (real cgroup v2, setuid drop, broker hiding)
        run: |
          T=$(ls target/debug/deps/privileged-* | grep -v '\.d$' | head -1)
          sudo MOAT_PRIV_TESTS=1 "$T" --test-threads=1
      - name: Capability probe
        run: sudo ./target/debug/moatd capabilities
      - name: netns enforcement test (nftables + cgroup v2 + moat-launch)
        run: sudo REQUIRE_NFT=1 linux/tests/netns-enforcement.sh target/debug
      - name: W10 ordinary-app inventory (observe-only) vs an independent receiver
        run: sudo linux/tests/ordinary-inventory.sh target/debug
      - name: W10 connect-time attribution (bpftrace, observe-only) vs receiver and kernel counters
        run: |
          sudo apt-get install -y -qq bpftrace
          sudo linux/tests/ordinary-inventory-ebpf.sh target/debug

  installed:
    name: installed systemd unit (W11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install nftables, jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables jq
      - name: Build
        run: cargo build -p moatd -p moatctl
      - name: Packaged unit under systemd, real user, real home
        run: sudo linux/tests/installed-unit.sh target/debug
