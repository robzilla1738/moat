[workspace]
resolver = "2"
members = ["core/moat-core", "core/moatctl", "core/moat-ffi", "linux/moatd"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/robzilla1738/moat"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ipnet = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
proptest = "1"
tempfile = "3"

[profile.release]
lto = "thin"
